<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Trials Gauntlet</title>
    <link rel="preload" href="./fonts/BarlowCondensed-BlackItalic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/BarlowCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07080a; overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body { position: fixed; inset: 0; }
      #app { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #app { background: radial-gradient(120% 90% at 40% 45%, #1a1409 0%, #07080a 70%); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
