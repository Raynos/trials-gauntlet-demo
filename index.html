    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F5C63; overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body { position: fixed; inset: 0; }
      #app { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #app { background: radial-gradient(120% 90% at 40% 45%, #1d2c30 0%, #111719 70%); }
      /* Loading screen "B Odometer", two tracks (assets/design/loading/SPEC.md §B; docs/design/game.md §12). Paints with the first
         HTML bytes: system font, no webfont, no bundle, no art. The script that fills it is src/boot/inline.ts, built into #boot below. */
      #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px)); background: radial-gradient(120% 90% at 50% 30%, #17737B 0%, #0F5C63 48%, #093B40 100%); color: #F6EFDF; font: 500 14px/1.4 -apple-system, "Helvetica Neue", Arial, system-ui, sans-serif; opacity: 1; transition: opacity 240ms cubic-bezier(.2,.8,.2,1); pointer-events: auto; }
      #loader.out { opacity: 0; pointer-events: none; }
      /* The ROCKHOP wordmark (outlines, no web font: it paints with the first bytes) in cream on the teal splash field; the build sha under it. */
      #loader .badge { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      #loader .plate { color: #EFE3C8; filter: drop-shadow(0 3px 8px rgba(0,0,0,.3)); }
      #loader .wm { display: block; width: clamp(200px, 44vmin, 380px); height: auto; overflow: visible; }
      #loader .build { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(246,239,223,.6); padding-left: 4px; font-variant-numeric: tabular-nums; }
      /* Two instruments: DOWNLOAD and SETUP, each a three-quarter ring with drum digits, its name and one live line. */
      #loader .gauges { display: flex; gap: 6vmin; justify-content: center; align-items: flex-start; width: 100%; max-width: 560px; }
      #loader .gauge { display: flex; flex-direction: column; align-items: center; width: min(44vw, 220px); text-align: center; }
      #loader .dial { position: relative; width: 100%; aspect-ratio: 1; }
      #loader .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #loader .rail { fill: none; stroke: rgba(239,227,200,.18); stroke-width: 5; stroke-linecap: butt; }
      #loader .ticks { fill: none; stroke: rgba(239,227,200,.32); stroke-width: 3; stroke-dasharray: .35 4.65; }
      #loader .ring { fill: none; stroke: #E4572E; stroke-width: 5; stroke-linecap: butt; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 220ms cubic-bezier(.2,.8,.2,1); }
      #loader .gauge.su .ring { stroke: #EFE3C8; }
      /* Drum digits: three columns of 0–9 in a window one digit high, each translated one way only. */
      #loader .drum { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); display: flex; align-items: baseline; height: 1em; overflow: hidden; font-size: clamp(38px, 11vmin, 64px); font-weight: 900; font-style: italic; line-height: 1; letter-spacing: -.02em; color: #f3f5f8; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #0b1416 0%, #17262a 18%, #1D2326 50%, #17262a 82%, #0b1416 100%); border-radius: .08em; padding: 0 .1em; box-shadow: inset 0 0 .3em rgba(0,0,0,.8), 0 .04em 0 rgba(255,255,255,.06); }
      #loader .drum::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.55) 100%); }
      #loader .col { display: inline-flex; flex-direction: column; width: .62em; transition: transform 240ms cubic-bezier(.2,.8,.2,1); }
      #loader .col b { display: block; height: 1em; line-height: 1; text-align: center; font-weight: 900; }
      #loader .col.h { width: .5em; }
      #loader .drum em { font-style: normal; font-size: .38em; color: #E4572E; margin-left: .1em; align-self: flex-end; padding-bottom: .12em; }
      #loader .gauge.su .drum em { color: #EFE3C8; }
      #loader .name { margin-top: 6px; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: rgba(243,245,248,.6); }
      #loader .line { min-height: 1.4em; margin-top: 2px; font-size: 12px; letter-spacing: .04em; color: rgba(243,245,248,.88); font-variant-numeric: tabular-nums; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Done steps fold into a count; the full row log sits behind a native disclosure, closed by default. */
      #loader .row { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(243,245,248,.62); font-variant-numeric: tabular-nums; }
      #loader .count { color: #4ae37f; }
      #loader details { position: relative; }
      #loader summary { list-style: none; cursor: pointer; border: 1px solid rgba(243,245,248,.28); border-radius: 6px; padding: 8px 14px; min-height: 28px; line-height: 1; -webkit-user-select: none; user-select: none; }
      #loader summary::-webkit-details-marker { display: none; }
      #loader summary::after { content: " ▾"; }
      #loader details[open] summary::after { content: " ▴"; }
      #loader ol { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); width: min(90vw, 520px); max-height: 34vh; overflow: auto; list-style: none; margin: 0; padding: 10px 12px; background: rgba(17,23,25,.96); border: 1px solid rgba(243,245,248,.12); border-radius: 8px; font-size: 12px; letter-spacing: 0; text-transform: none; color: rgba(243,245,248,.62); text-align: left; }
      #loader li { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; white-space: nowrap; }
      #loader li span:first-child { overflow: hidden; text-overflow: ellipsis; }
      #loader li.on { color: #f3f5f8; }
      #loader li.ok::after { content: "✓"; color: #4ae37f; }
      #loader li.todo { color: rgba(243,245,248,.32); }
      #loader li.slow span:first-child::before { content: "■ "; color: #ff3d3d; }
      #loader li.bghead { margin-top: 8px; color: rgba(243,245,248,.42); letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
      #loader li.bg { color: rgba(243,245,248,.42); }
      #loader li.bg::after { content: "↓"; color: rgba(243,245,248,.42); }
      #loader li.bg.in::after { content: "↓ in"; }
      #loader .err { display: none; color: #FFD2C4; max-width: 560px; text-align: center; }
      #loader .err button { display: block; margin: 12px auto 0; min-height: 48px; padding: 0 28px; border: 0; border-radius: 10px; background: #E4572E; color: #FFF4E2; font: 700 15px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      #loader.failed .err { display: block; }
      #loader .foot { position: absolute; left: 20px; right: 20px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(243,245,248,.4); font-variant-numeric: tabular-nums; }
      @media (max-height: 500px) { #loader { gap: 10px; } #loader .wm { width: clamp(180px, 40vmin, 260px); } #loader .gauge { width: min(30vh, 160px); } #loader ol { max-height: 40vh; } }
    </style>
